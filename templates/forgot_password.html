{{define "forgot_password.html"}}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · StudyLog</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-badge">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 class="auth-title">パスワードの再設定</h1>
    <p class="auth-subtitle">アカウント作成時に発行された<br>リカバリーコードを入力してください。</p>
    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
    <form method="post" action="/forgot-password" class="stack-form">
      <label>Username
        <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>
      </label>
      <label>Recovery code
        <input type="text" name="recoveryCode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required style="font-family: var(--font-mono); letter-spacing: 0.06em;">
      </label>
      <label>New password
        <input type="password" name="newPassword" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Confirm new password
        <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit" class="primary-button">Reset password</button>
    </form>
    <p class="auth-footnote">
      リカバリーコードが見つからない場合は、もう一方のユーザーか、データファイル（<code>data/studylog.json</code>）を管理している人に相談してください。<br>
      <a href="/login">ログインに戻る</a>
    </p>
  </main>
</body>
</html>
{{end}}
